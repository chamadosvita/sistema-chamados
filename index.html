<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chamados - Vita Ambiental</title>
  <link href="style.css" rel="stylesheet" type="text/css">
</head>

<body>

  <!-- HEADER NOVO -->
  <header class="header">

    <div class="header-left">
      <img src="logo.png" alt="Logo" class="logo">
      <div class="titulo">
        <h1>Vita Ambiental</h1>
        <span>Sistema de Chamados</span>
      </div>
    </div>

    <div class="header-right">
      <button id="btnPainel" class="btn-painel">Acessar Painel</button>
    </div>

  </header>

  <main>

    <form id="formChamado">

      <label for="nome">Nome Completo:</label>
      <input type="text" id="nome" name="nome" required />

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required />

      <label for="motivo">Motivo do Chamado:</label>
      <textarea id="motivo" name="motivo" rows="4" required></textarea>

      <label for="area">Por qual suporte deseja contatar?:</label>
      <select id="area" required>

        <option value="">Selecione...</option>

        <option value="TI_AGUA_SUL">T.I Água Sul (Otavio)</option>
        <option value="TI_BARRA_FUNDA">T.I Barra Funda (Igor)</option>
        <option value="TI_BARRA_FUNDA_2">T.I Barra Funda (Marcelo)</option>
        <option value="SUPORTE_TI">Suporte T.I (Claudio)</option>

      </select>

      <button type="submit">Enviar Chamado</button>

    </form>

    <div id="mensagem" class="hidden"></div>

  </main>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    emailjs.init("4M9U0ZFGixP5mS166");
  </script>

  <script src="script.js"></script>

</body>
</html>
